<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belajar css</title>
    <style>
      h1,
      h3 {
        color: rgb(255, 0, 149);
        font-size: 80px;
        font-family: "Segoe UI";
        text-align: center;
      }

      h3 {
        color: rgb(5, 17, 4);
      }

      p {
        color: rgb(79, 142, 236);
      }

      div p {
        font-size: 70px;
      }

      h3 + p {
        text-align: center;
      }

      div + p {
        font-family: arial;
      }
    </style>
  </head>
  <body>
   

    <h1>Hello World !</h1>
    <h3>Hello ITW !</h3>

    <p>Paragraf 1</p>
    <div>
      <p>Paragraf 2</p>
    </div>
    <p>Paragraf 3</p>
  </body>
</html>
