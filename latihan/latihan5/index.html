<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Blackpink Lightbox Gallery | Tugas #5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>BLACKPINK MEMBERS GALLERY</h1>

    <div class="container">
        <ul class="gallery">
            <li>
                <a href="#lightbox-jisoo">
                    <img src="img/thumbs/jisoo.jpg" alt="Jisoo">
                    <span>JISOO</span>
                </a>

                <div class="overlay" id="lightbox-jisoo">
                    <a href="#" class="close">X CLOSE</a>

                    <a href="#lightbox-lisa" class="prev">Previous</a>
                    <a href="#lightbox-jennie" class="next">Next</a>
                    
                    <img src="img/full/jisoo.jpg" alt="Jisoo Full">
                </div>
            </li>

            <li>
                <a href="#lightbox-jennie">
                    <img src="img/thumbs/jennie.jpg" alt="Jennie">
                    <span>JENNIE</span>
                </a>

                <div class="overlay" id="lightbox-jennie">
                    <a href="#" class="close">X CLOSE</a>
                    <a href="#lightbox-jisoo" class="prev">Previous</a>
                    <a href="#lightbox-rose" class="next">Next</a>

                    <img src="img/full/jennie.jpg" alt="Jennie Full">
                </div>
            </li>
            
            <li>
                <a href="#lightbox-rose">
                    <img src="img/thumbs/rose.jpg" alt="Rose">
                    <span>ROSÉ</span>
                </a>

                <div class="overlay" id="lightbox-rose">
                    <a href="#" class="close">X CLOSE</a>
                    <a href="#lightbox-jennie" class="prev">Previous</a>
                    <a href="#lightbox-lisa" class="next">Next</a>

                    <img src="img/full/rose.jpg" alt="Rose Full">
                </div>
            </li>

            <li>
                <a href="#lightbox-lisa">
                    <img src="img/thumbs/lisa.jpg" alt="Lisa">
                    <span>LISA</span>
                </a>

                <div class="overlay" id="lightbox-lisa">
                    <a href="#" class="close">X CLOSE</a>
                    <a href="#lightbox-rose" class="prev">Previous</a>
                    <a href="#lightbox-jisoo" class="next">Next</a>

                    <img src="img/full/lisa.jpg" alt="Lisa Full">
                </div>
            </li>
        </ul>

        <div class="clear"></div>
    </div>
    
</body>
</html>
